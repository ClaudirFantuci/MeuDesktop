{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Meu Desktop{% endblock %}</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header class="topbar">
        <div class="container nav">
            <a class="brand" href="{% url 'index' %}">Meu Desktop</a>

            <button class="menu-toggle" type="button" aria-label="Abrir menu" aria-expanded="false" aria-controls="menu-principal">
                ☰
            </button>

            <nav id="menu-principal" class="menu-links">
                <a href="{% url 'index' %}">Início</a>
                <a href="{% url 'fabricante-list' %}">Fabricantes</a>
                <a class="btn-menu" href="{% url 'fabricante-create' %}">Novo Fabricante</a>
            </nav>
        </div>
    </header>

    <main class="container page-content">
        {% block content %}
        <section class="card">
            <h2>Simulador de Montagem</h2>
            <p>
                Use o menu para cadastrar e gerenciar os fabricantes de componentes.
            </p>
        </section>
        {% endblock %}
    </main>

    <script>
        const menuToggle = document.querySelector('.menu-toggle');
        const menu = document.querySelector('#menu-principal');

        if (menuToggle && menu) {
            menuToggle.addEventListener('click', () => {
                const aberto = menu.classList.toggle('open');
                menuToggle.setAttribute('aria-expanded', aberto ? 'true' : 'false');
            });
        }
    </script>
</body>
</html>
